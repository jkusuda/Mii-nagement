# The website: `docker compose --env-file server.env up -d` (deploy/README.md).
# Caddy serves the landing page and the desktop download; there is no backend here
# (the desktop app brings its own).
services:
  caddy:
    image: caddy:2.10.2
    ports:
      - "80:80"
      - "443:443"
    environment:
      MII_DOMAIN: ${MII_DOMAIN:?set MII_DOMAIN in server.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./landing:/srv/landing:ro
      - ../downloads:/srv/downloads:ro
      - caddy:/data
    restart: unless-stopped

volumes:
  caddy:
