[project]
name = "mii"
version = "0.1.0"
description = "Mii-nagement backend: workflow engine, ACP coding agents, event bus"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "websockets>=14",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

# This is an app, not a library, so uv doesn't need to build/install it.
# Commands run from backend/, which puts the `mii` package on the import path.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
