[project]
name = "mii"
version = "0.2.0"
description = "Mii-nagement backend: Django + Channels, workflow engine, ACP coding agents, OpenRouter brain"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1",
    "channels>=4.3",
    "uvicorn[standard]>=0.32",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "websockets>=14",
    "agent-client-protocol>=0.12",
    "keyring>=25.7.0",
    "psycopg[binary]>=3.2",
    "pyjwt[crypto]>=2.9",
    "google-genai>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-django>=4.9",
    "ruff>=0.14",
]

# This is an app, not a library, so uv doesn't need to build/install it.
# Commands run from backend/, which puts the `mii` package on the import path.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
DJANGO_SETTINGS_MODULE = "mii.settings"

# Lint and format: `make lint` / `make fmt` (or `uv run ruff check .` / `uv run ruff format .` from backend/).
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["mii/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF012",  # mutable class attributes: Django models and handler tables are meant to be shared
    "B904",    # `raise ... from e` inside except: our error messages are rewritten for the user on purpose
]

[tool.ruff.lint.per-file-ignores]
"mii/asgi.py" = ["E402"]  # django.setup() must run before the Channels imports

[tool.ruff.lint.isort]
known-first-party = ["mii"]
