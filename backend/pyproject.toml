[project]
name = "mii"
version = "0.2.0"
description = "Mii-nagement backend: Django + Channels, workflow engine, ACP coding agents, OpenRouter brain"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1",
    "channels>=4.3",
    "uvicorn[standard]>=0.32",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "websockets>=14",
    "agent-client-protocol>=0.12",
    "keyring>=25.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-django>=4.9",
]

# This is an app, not a library, so uv doesn't need to build/install it.
# Commands run from backend/, which puts the `mii` package on the import path.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
DJANGO_SETTINGS_MODULE = "mii.settings"
